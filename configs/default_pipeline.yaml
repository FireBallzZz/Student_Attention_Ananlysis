# Classroom Attention Research System Configuration
# Pipeline Stage Configurations

experiment:
  name: "pilot_baseline_run"
  seed: 42
  device: "cuda:0"  # falls back to cpu if unavailable

ingestion:
  sample_fps: 10          # frames per second to sample (native is 30)
  target_width: 1280
  target_height: 720
  allowed_codecs: ["mp4v", "avc1", "h264"]
  duplicate_frame_threshold: 0.99  # SSIM / normalized difference threshold

detection:
  model_name: "yolo11n-pose.pt"  # Ultralytics YOLO11 pose estimation
  conf_threshold: 0.35
  iou_threshold: 0.50
  person_class_id: 0
  min_box_area_ratio: 0.002     # discard micro-artifacts (< 0.2% of frame)
  max_box_area_ratio: 0.95

tracking:
  tracker_type: "bytetrack"     # "bytetrack" or "deepsort"
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30              # frames to retain lost tracks
  match_thresh: 0.8
  deepsort_max_dist: 0.2
  deepsort_max_iou_distance: 0.7
  deepsort_max_age: 30
  deepsort_n_init: 3

modalities:
  keypoint_conf_threshold: 0.4
  face_min_size_px: 20          # minimum face width/height to consider reliable
  head_pose:
    pitch_forward_range: [-15.0, 20.0]  # normal desk/screen viewing angle (degrees)
    yaw_focused_range: [-25.0, 25.0]     # looking forward towards teacher/board
    roll_normal_range: [-15.0, 15.0]
  posture:
    upright_torso_angle: [70.0, 110.0]  # degrees relative to horizontal
    slump_angle_threshold: 60.0
  motion:
    energy_window_frames: 5
    restless_energy_threshold: 25.0

features:
  feature_window_sec: 1.0       # temporal window for rolling feature aggregation
  fill_missing_strategy: "zero_with_mask"

scoring:
  calibrated_scale: [0, 100]
  inattentive_threshold: 40.0   # score below 40 considered inattentive
  attentive_threshold: 65.0     # score above 65 considered attentive

attention_drop:
  moving_average_window_sec: 3.0
  drop_magnitude_threshold: 25.0  # sustained score drop of >= 25 points
  sustained_duration_sec: 2.5     # must persist for >= 2.5 seconds
  cooldown_sec: 5.0               # cooldown before re-triggering for same student
  min_track_validity_ratio: 0.7   # requires 70% detection presence to distinguish drop from occlusion

recommendations:
  model: "gemini-2.5-flash"
  caution_level: "high"
  distinguish_internal_mental_state: true
